<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tether</title>
  <script type="module" src="./app.ts"></script>
</head>
<body>
  <span id="notice" class="wm-notice" role="status" aria-live="polite">Starting…</span>
  <span id="toolbar-controls" class="wm-integrated-controls" hidden>
    <button id="comment" class="wm-comment-button" type="button" aria-label="Threads" title="Threads" aria-pressed="false">
      <svg viewBox="0 0 24 24" role="img" aria-label="Threads"><path d="M5 4.5h14A1.5 1.5 0 0 1 20.5 6v9A1.5 1.5 0 0 1 19 16.5h-7l-4.25 3v-3H5A1.5 1.5 0 0 1 3.5 15V6A1.5 1.5 0 0 1 5 4.5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      <span id="pending-count" class="wm-pending-count" hidden>0</span>
    </button>
    <button id="copy-document" class="wm-comment-button" type="button" aria-label="Copy complete Markdown" title="Copy complete Markdown">
      <svg viewBox="0 0 24 24" role="img" aria-label="Copy complete Markdown"><rect x="8" y="8" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
    </button>
    <span class="wm-theme-picker">
      <button id="theme" class="wm-comment-button" type="button" aria-label="Theme" title="Theme" aria-expanded="false">
        <svg viewBox="0 0 24 24" role="img" aria-label="Theme"><path d="M12 3.5a8.5 8.5 0 0 0 0 17Z" fill="currentColor"/><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
      </button>
      <span id="theme-menu" class="wm-theme-menu" hidden></span>
    </span>
    <span class="wm-zoom-control">
      <button id="zoom" class="wm-comment-button" type="button" aria-label="Zoom" title="Zoom" aria-expanded="false">
        <svg viewBox="0 0 24 24" role="img" aria-label="Zoom"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m15.4 15.4 4.1 4.1" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
      <span id="zoom-menu" class="wm-zoom-menu" hidden>
        <input id="zoom-slider" type="range" min="75" max="175" step="5" value="100" aria-label="Document zoom">
        <output id="zoom-label" for="zoom-slider">100%</output>
      </span>
    </span>
    <span id="save-status" class="wm-save-indicator"></span>
  </span>
  <aside id="conflict" hidden>
    <span id="conflict-message">This file changed elsewhere. Your unsaved version has not been overwritten.</span>
    <button id="copy" type="button" hidden>Copy mine</button>
    <button id="reload" type="button">Reload disk</button>
    <button id="save-review" type="button" hidden>Save reviewed</button>
    <button id="cancel-review" type="button" hidden>Cancel review</button>
  </aside>
  <div id="workspace">
    <main id="editor" spellcheck="false"></main>
    <div id="annotations"></div>
  </div>
</body>
</html>
