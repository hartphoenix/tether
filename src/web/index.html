<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Tether"><meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Tether</title>
  <link rel="icon" type="image/png" href="./favicon.png">
  <script type="module" src="./app.ts"></script>
</head>
<body>
  <span id="notice" class="wm-notice" role="status" aria-live="polite">Starting…</span>
  <span id="toolbar-controls" class="wm-integrated-controls" hidden>
    <button id="source" class="wm-comment-button" type="button" aria-label="Edit Markdown source" title="Edit Markdown source" aria-pressed="false"><span data-icon="code-xml"></span></button>
    <span class="wm-zoom-control">
      <button id="zoom" class="wm-comment-button" type="button" aria-label="Zoom" title="Zoom" aria-expanded="false">
        <span data-icon="zoom-in"></span>
      </button>
      <span id="zoom-menu" class="wm-zoom-menu" hidden>
        <input id="zoom-slider" type="range" min="75" max="175" step="5" value="100" aria-label="Document zoom">
        <output id="zoom-label" for="zoom-slider">100%</output>
      </span>
    </span>
    <span class="wm-theme-picker">
      <button id="theme" class="wm-comment-button" type="button" aria-label="Theme" title="Theme" aria-expanded="false">
        <span data-icon="paint-roller"></span>
      </button>
      <span id="theme-menu" class="wm-theme-menu" hidden></span>
    </span>
    <button id="theme-maker" type="button" aria-expanded="false">Theme maker…</button>
    <button id="comment" class="wm-comment-button wm-threads-button" type="button" aria-label="Threads" title="Threads" aria-pressed="false">
      <span data-icon="tether-mark"></span>
      <span id="pending-count" class="wm-pending-count" hidden>0</span>
    </button>
  </span>
  <div id="workspace">
    <aside id="conflict" hidden>
      <div class="wm-review-context">
        <span id="conflict-message">This file changed elsewhere. Your unsaved version has not been overwritten.</span>
        <div class="wm-review-navigation" role="group" aria-label="Review navigation" hidden>
          <button id="previous-change" type="button" title="Previous change" aria-label="Previous change" hidden></button>
          <button id="next-change" type="button" title="Next change" aria-label="Next change" hidden></button>
        </div>
      </div>
      <button id="reload" type="button">Reload disk</button>
      <div class="wm-review-actions" role="group" aria-label="Review actions" hidden>
        <button id="save-review" type="button" title="Mark all remaining changes as seen" hidden>Mark all as seen</button>
        <button id="revert-review" type="button" title="Revert all remaining changes" hidden>Revert all</button>
      </div>
    </aside>
    <main id="editor" spellcheck="false"></main>
    <div id="annotations"></div>
  </div>
</body>
</html>
