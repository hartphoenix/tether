name: Publish update metadata
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
concurrency:
  group: tether-update-publication
  cancel-in-progress: false
permissions:
  contents: read
env:
  TETHER_ROOT_SHA256: 7c3d5f040c6c855813828a72a31a925efc7b62223c6eab8a32f8b0a40c894f74
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - uses: actions/checkout@v4
        with:
          ref: update-metadata
          path: publisher/public
      - name: Refresh with service authority only
        env:
          TETHER_UPDATE_SERVICE_KEYS: ${{ secrets.TETHER_UPDATE_SERVICE_KEYS }}
        run: bun scripts/update-hosting.ts refresh publisher "$TETHER_ROOT_SHA256"
      - name: Require approved archives before deployment
        run: bun scripts/update-hosting.ts assets publisher/public "$TETHER_ROOT_SHA256"
      - name: Preserve numbered metadata before deployment
        working-directory: publisher/public
        run: |
          set -euo pipefail
          version=$(bun -e 'console.log((await Bun.file("metadata/timestamp.json").json()).signed.version)')
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "metadata/$version.snapshot.json" metadata/timestamp.json
          git commit -m "Refresh approved update metadata $version"
          git push origin HEAD:update-metadata
      - name: Prepare public artifact
        run: |
          mkdir -p "$RUNNER_TEMP/tether-site"
          cp -R publisher/public/metadata "$RUNNER_TEMP/tether-site/metadata"
          cp -R publisher/public/bootstrap "$RUNNER_TEMP/tether-site/bootstrap"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/tether-site
      - name: Deploy public metadata
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live signatures and expiry
        run: bun scripts/update-hosting.ts check publisher/public "$TETHER_ROOT_SHA256"
