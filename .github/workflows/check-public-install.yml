name: Verify published installation
on:
  workflow_dispatch:
    inputs:
      version:
        description: Approved version expected from the README installer
        required: true
        default: '0.1.0'
      archive_sha256:
        description: Approved archive SHA-256
        required: true
        default: a6a95ea3eb33dbeae8a23bbcb2d36608e00ab3a28a08b85b8295d28249783a65
permissions:
  contents: read
jobs:
  install:
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      EXPECTED_VERSION: ${{ inputs.version }}
      EXPECTED_SHA256: ${{ inputs.archive_sha256 }}
      TETHER_PROFILE: public-release-check
      TETHER_SUPPRESS_BROWSER: '1'
    steps:
      - name: Set isolated installation paths
        run: |
          echo "TETHER_INSTALL_DIR=$RUNNER_TEMP/tether-public/install" >> "$GITHUB_ENV"
          echo "TETHER_BIN_DIR=$RUNNER_TEMP/tether-public/bin" >> "$GITHUB_ENV"
          echo "TETHER_CONFIG_DIR=$RUNNER_TEMP/tether-public/config" >> "$GITHUB_ENV"
          echo "TETHER_RUNTIME_DIR=$RUNNER_TEMP/tether-public/runtime" >> "$GITHUB_ENV"
          echo "WAVETERM_CONFIG_DIR=$RUNNER_TEMP/tether-public/wave" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - name: Download and run the README installer
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          [[ "$EXPECTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$EXPECTED_SHA256" =~ ^[a-f0-9]{64}$ ]]
          curl --proto '=https' --proto-redir '=https' --fail --silent --show-error --location --max-time 120 https://github.com/hartphoenix/tether/releases/latest/download/install.sh --output "$RUNNER_TEMP/tether-install.sh"
          bash "$RUNNER_TEMP/tether-install.sh" --no-open
      - name: Verify installed archive identity and production update trust
        run: |
          bun - <<'JS'
          import { realpath, readFile } from 'node:fs/promises';
          import { join, basename } from 'node:path';
          import { discoverVerifiedRelease } from './src/releases/verified-update';
          const root = await realpath(join(process.env.TETHER_INSTALL_DIR, 'current'));
          if (basename(root) !== process.env.EXPECTED_SHA256) throw new Error('Installed archive differs from approval');
          const manifest = JSON.parse(await readFile(join(root, 'release.json'), 'utf8'));
          if (manifest.version !== process.env.EXPECTED_VERSION) throw new Error('Unexpected installed version');
          if (await discoverVerifiedRelease(root) !== null) throw new Error('Published installer is behind the signed update repository');
          console.log('Published installer selected the approved archive; production update verification passed.');
          JS
      - name: Exercise the downloaded package
        run: bun scripts/check-release.ts "$TETHER_INSTALL_DIR/current"
      - name: Stop isolated service
        if: always()
        run: |
          if [ -x "$TETHER_BIN_DIR/tether" ]; then "$TETHER_BIN_DIR/tether" daemon stop; fi
