name: macOS checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun scripts/build-release.ts "$RUNNER_TEMP/tether-candidate/app"
      - run: bun scripts/check-release.ts "$RUNNER_TEMP/tether-candidate/app"
      - run: bun scripts/check-install.ts "$RUNNER_TEMP/tether-candidate/tether-darwin-$(uname -m | sed 's/x86_64/x64/').tar.gz"
