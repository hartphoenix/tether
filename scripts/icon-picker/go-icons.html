<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tether · Go icons</title>
  <link rel="stylesheet" href="/fonts.css"><link rel="stylesheet" href="/style.css">
  <script type="module" src="/go-icons.js"></script>
</head>
<body>
  <main class="go-picker">
    <header><div class="brand">TETHER <span>/</span> WORKBENCH</div><span id="save-status" role="status">Loading…</span><button id="retry" hidden>Retry save</button></header>
    <nav aria-label="Icon picker pages"><a href="/">Interface icons</a><a href="/go-icons" aria-current="page">Go icons</a></nav>
    <section class="intro"><div><h1>Go icons</h1><p>Click an icon to include or exclude it. Comments and selections save automatically.</p></div><span id="progress"></span></section>
    <div id="go-rows" aria-label="Available Go icons"></div>
    <footer><span>Choices are saved for review; they do not change the live Go button.</span><code id="save-path"></code></footer>
  </main>
</body>
</html>
